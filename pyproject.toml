[project]
name = "ai-engineer-journey"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy"]

[tool.pytest.ini_options]
pythonpath = [".", "objectOrientedPython"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "objectOrientedPython"

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:"
]
show_missing = true
fail_under = 80

[tool.setuptools.packages.find]
include = ["library_app*"]