[project]
name = "library-app"
version = "0.1.0"
description = "A small library manager CLI"
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy"]

[project.scripts]
library = "library_app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["library_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
